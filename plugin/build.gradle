plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'dev.lukka.oculus'
version = '1.0.0-SNAPSHOT'

import org.gradle.internal.os.OperatingSystem

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.lunarclient.dev' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21-R0.1-SNAPSHOT'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.23.1'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.23.1'
    compileOnly 'com.lunarclient:apollo-api:1.2.9'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7'
    compileOnly 'net.luckperms:api:5.4'
    compileOnly 'me.lucko:spark-api:0.1-SNAPSHOT'

    implementation 'io.javalin:javalin:6.3.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'dev.samstevens.totp:totp:1.7.1'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    implementation 'org.flywaydb:flyway-core:9.22.3'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    testImplementation 'io.papermc.paper:paper-api:1.21-R0.1-SNAPSHOT'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.apache.logging.log4j:log4j-api:2.23.1'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.23.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

test {
    useJUnitPlatform()
    jvmArgs '-Dnet.bytebuddy.experimental=true'
}

tasks.named('jar') {
    archiveClassifier.set('raw')
}

tasks.named('shadowJar') {
    archiveClassifier.set('')
    mergeServiceFiles()
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// ── npm / Next.js ─────────────────────────────────────────────────────────────
def npm = OperatingSystem.current().isWindows() ? 'npm.cmd' : 'npm'

task npmInstall(type: Exec) {
    group = 'build'
    description = 'Install web dependencies'
    workingDir = file("${rootDir}/web")
    commandLine npm, 'ci'
}

task npmBuild(type: Exec) {
    dependsOn npmInstall
    group = 'build'
    description = 'Build Next.js export'
    workingDir = file("${rootDir}/web")
    commandLine npm, 'run', 'build'
}

tasks.named('shadowJar') {
    dependsOn npmBuild
    from("${rootDir}/web/out") {
        into "www"
    }
}
